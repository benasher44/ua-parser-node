name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest      # darwin-arm64 (native, rolling macOS)
            target: aarch64-apple-darwin
            pkg: darwin-arm64
          - host: ubuntu-latest     # linux-x64-gnu
            target: x86_64-unknown-linux-gnu
            pkg: linux-x64-gnu
          - host: ubuntu-24.04-arm  # linux-arm64-gnu (the Lambda target)
            target: aarch64-unknown-linux-gnu
            pkg: linux-arm64-gnu
          - host: ubuntu-latest     # linux-arm64-musl (cross-compiled via zig)
            target: aarch64-unknown-linux-musl
            pkg: linux-arm64-musl
            extra: --cross-compile
          - host: windows-latest    # win32-x64-msvc
            target: x86_64-pc-windows-msvc
            pkg: win32-x64-msvc
    name: build ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable   # packageManager: yarn@4.18.1 — runner's global yarn is 1.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.settings.target }}
      - name: Setup zig (musl cross toolchain)
        if: contains(matrix.settings.target, 'musl')
        uses: mlugg/setup-zig@v2
      - name: Build (native)
        run: |
          yarn install
          yarn napi build --platform --release --format esm --target ${{ matrix.settings.target }} ${{ matrix.settings.extra }} --output-dir npm/${{ matrix.settings.pkg }}
      # tests run against the just-built binary: copy it to the repo root so the
      # committed loader's local fallback finds it (per-platform, in place).
      # The musl slice is aarch64 cross-compiled on an x64 host — untestable here.
      - name: Stage binary for tests
        if: ${{ !matrix.settings.extra }}
        run: |
          node -e "const fs=require('fs'),d='npm/${{ matrix.settings.pkg }}';const f=fs.readdirSync(d).find(x=>x.endsWith('.node'));fs.copyFileSync(d+'/'+f,f)"
      - name: Test
        if: ${{ !matrix.settings.extra }}
        run: yarn test
      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.settings.target }}
          path: npm/
          if-no-files-found: error

  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: yarn install
      - run: yarn napi build --platform --release --format esm
      - run: node --test test/smoke.test.mjs


  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # npm trusted publishing (OIDC) — no token needed
      contents: read
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - name: Download all binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          merge-multiple: true
          path: .
      # artifacts contain the npm/ CONTENTS (upload-artifact strips the top
      # level): merge lands at ./<platform>/ — stage them into the npm dirs
      - name: Stage binaries into npm dirs
        run: |
          for d in darwin-arm64 linux-x64-gnu linux-arm64-gnu linux-arm64-musl win32-x64-msvc; do
            cp "$d/ua-parser-node.$d.node" "npm/$d/ua-parser-node.$d.node"
          done
      - name: Publish platform packages (binaries from the downloaded artifacts)
        run: |
          set +e
          fail=0
          for dir in npm/*/; do
            test -n "$(find "$dir" -name '*.node' | head -1)" || { echo "no .node in $dir"; fail=1; continue; }
            npm publish --provenance --tag alpha "$dir"
            if [ $? -eq 0 ]; then echo "PUBLISHED: $dir"; else echo "FAILED: $dir"; fail=1; fi
          done
          exit $fail
      - name: Publish main package
        run: npm publish --provenance --tag alpha
