name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-14          # darwin-arm64
            target: aarch64-apple-darwin
            pkg: darwin-arm64
          - host: macos-13          # darwin-x64
            target: x86_64-apple-darwin
            pkg: darwin-x64
          - host: ubuntu-latest     # linux-x64-gnu
            target: x86_64-unknown-linux-gnu
            pkg: linux-x64-gnu
          - host: ubuntu-24.04-arm  # linux-arm64-gnu (the Lambda target)
            target: aarch64-unknown-linux-gnu
            pkg: linux-arm64-gnu
          - host: ubuntu-latest     # linux-arm64-musl (cross-compiled)
            target: aarch64-unknown-linux-musl
            pkg: linux-arm64-musl
            docker: ghcr.io/napi-rs/napi-rs/nodejs:aarch64-musl
          - host: windows-latest    # win32-x64-msvc
            target: x86_64-pc-windows-msvc
            pkg: win32-x64-msvc
    name: build ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - name: Build (docker musl)
        if: matrix.settings.docker
        run: |
          docker run --rm -v ${{ github.workspace }}:/build -w /build ${{ matrix.settings.docker }} \
            sh -c "yarn install && napi build --platform --release --target aarch64-unknown-linux-musl --output npm/linux-arm64-musl"
      - name: Build (native)
        if: ${{ !matrix.settings.docker }}
        run: |
          npm install
          npx napi build --platform --release --target ${{ matrix.settings.target }} --output npm/${{ matrix.settings.pkg }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.settings.target }}
          path: |
            npm/*/ua-parser-node.node
            *.node

  test:
    needs: build
    strategy:
      matrix:
        include:
          - os: macos-14    # darwin-arm64
          - os: ubuntu-24.04-arm  # linux-arm64-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Download platform binary
        uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          merge-multiple: true
          path: .
      - run: npm install
      - run: npm test

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # npm trusted publishing (OIDC) — no NPM_TOKEN needed
      contents: read
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - name: Download all binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          merge-multiple: true
          path: .
      - run: npm install
      - run: npx napi prepublish -t npm
      - name: Publish platform packages
        run: npx napi publish --provenance
      - name: Publish main package
        run: npm publish --provenance
