name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-14          # darwin-arm64
            target: aarch64-apple-darwin
            pkg: darwin-arm64
          - host: macos-13          # darwin-x64
            target: x86_64-apple-darwin
            pkg: darwin-x64
          - host: ubuntu-latest     # linux-x64-gnu
            target: x86_64-unknown-linux-gnu
            pkg: linux-x64-gnu
          - host: ubuntu-24.04-arm  # linux-arm64-gnu (the Lambda target)
            target: aarch64-unknown-linux-gnu
            pkg: linux-arm64-gnu
          - host: ubuntu-latest     # linux-arm64-musl (cross-compiled via zig)
            target: aarch64-unknown-linux-musl
            pkg: linux-arm64-musl
            extra: --cross-compile
          - host: windows-latest    # win32-x64-msvc
            target: x86_64-pc-windows-msvc
            pkg: win32-x64-msvc
    name: build ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.settings.target }}
      - name: Build (native)
        run: |
          npm install
          npx napi build --platform --release --target ${{ matrix.settings.target }} ${{ matrix.settings.extra }} --output-dir npm/${{ matrix.settings.pkg }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.settings.target }}
          path: |
            npm/*/ua-parser-node.node
            *.node

  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm install
      - run: npx napi build --platform --release
      - run: node --test test/smoke.test.mjs

  test:
    if: github.event_name != 'pull_request'
    needs: build
    strategy:
      matrix:
        include:
          - os: macos-14    # darwin-arm64
          - os: ubuntu-24.04-arm  # linux-arm64-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Download platform binary
        uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          merge-multiple: true
          path: .
      - run: npm install
      - run: npm test

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # npm trusted publishing (OIDC) — no NPM_TOKEN needed
      contents: read
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org/
      - name: Download all binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          merge-multiple: true
          path: .
      - run: npm install
      - run: npx napi pre-publish --tagstyle npm
      - name: Publish platform packages
        run: for dir in npm/*/; do npm publish --provenance "$dir"; done
      - name: Publish main package
        run: npm publish --provenance
