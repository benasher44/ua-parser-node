name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest      # darwin-arm64 (native, rolling macOS)
            target: aarch64-apple-darwin
            pkg: darwin-arm64
          - host: ubuntu-latest     # linux-x64-gnu
            target: x86_64-unknown-linux-gnu
            pkg: linux-x64-gnu
          - host: ubuntu-24.04-arm  # linux-arm64-gnu (the Lambda target)
            target: aarch64-unknown-linux-gnu
            pkg: linux-arm64-gnu
          - host: ubuntu-latest     # linux-arm64-musl (cross-compiled via zig)
            target: aarch64-unknown-linux-musl
            pkg: linux-arm64-musl
            extra: --cross-compile
          - host: windows-latest    # win32-x64-msvc
            target: x86_64-pc-windows-msvc
            pkg: win32-x64-msvc
    name: build ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.settings.target }}
      - name: Setup zig (musl cross toolchain)
        if: contains(matrix.settings.target, 'musl')
        uses: mlugg/setup-zig@v2
      - name: Build (native)
        run: |
          npm install
          npx napi build --platform --release --target ${{ matrix.settings.target }} ${{ matrix.settings.extra }} --output-dir npm/${{ matrix.settings.pkg }}
      # tests run against the just-built binary: copy it to the repo root so the
      # committed loader's local fallback finds it (per-platform, in place).
      # The musl slice is aarch64 cross-compiled on an x64 host — untestable here.
      - name: Stage binary for tests
        if: ${{ !matrix.settings.extra }}
        run: |
          node -e "const fs=require('fs'),d='npm/${{ matrix.settings.pkg }}';const f=fs.readdirSync(d).find(x=>x.endsWith('.node'));fs.copyFileSync(d+'/'+f,f)"
      - name: Test
        if: ${{ !matrix.settings.extra }}
        run: npm test
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.settings.target }}
          path: npm/
          if-no-files-found: error

  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm install
      - run: npx napi build --platform --release
      - run: node --test test/smoke.test.mjs


  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org/
      - name: Download all binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          merge-multiple: true
          path: .
      - run: npm install
      - name: Publish platform packages (binaries from the downloaded artifacts)
        run: |
          for dir in npm/*/; do
            test -n "$(find "$dir" -name '*.node' | head -1)" || { echo "no .node in $dir"; exit 1; }
            npm publish --tag alpha "$dir"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish main package
        run: npm publish --tag alpha
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
