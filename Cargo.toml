[package]
name = "ua-parser-node"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Node bindings for the ua-parser (uap-rust) user-agent parser"
repository = "https://github.com/benasher44/ua-parser-node"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
ua-parser = "0.2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
once_cell = "1"

[profile.release]
lto = true
strip = "symbols"
